name: "olist"
version: "1.0.0"
profile: "ds_portfolio"

config-version: 2

require-dbt-version: [">=1.8.0", "<2.0.0"]

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Layout: `staging` cleans and types the raw tables one-to-one; `marts` is what
# a business user would query. Staging stays as views (cheap, always fresh),
# marts are materialised as tables because they are read repeatedly.
models:
  olist:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
