version: 2

# Column-level contracts for the staging layer.
#
# These run as part of `dbt build`, so a change in the shape of the source data
# fails the build loudly instead of producing a quietly wrong report.

models:
  - name: stg_orders
    description: "Order lifecycle timestamps and status. One row per order."
    columns:
      - name: order_id
        description: "Primary key."
        data_tests: [unique, not_null]
      - name: customer_id
        description: "Foreign key to stg_customers. One customer row per order."
        data_tests: [not_null]
      - name: order_status
        description: "Lifecycle status of the order."
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - delivered
                  - shipped
                  - canceled
                  - unavailable
                  - invoiced
                  - processing
                  - created
                  - approved

  - name: stg_customers
    description: >
      Customer location per order. `customer_id` is per-order;
      `customer_unique_id` identifies the actual person.
    columns:
      - name: customer_id
        description: "Primary key."
        data_tests: [unique, not_null]
      - name: customer_unique_id
        description: "The real customer identity, stable across orders."
        data_tests: [not_null]
      - name: state
        description: "Two-letter Brazilian state code."
        data_tests: [not_null]

  - name: stg_order_items
    description: "One row per item inside an order."
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: order_item_id
        description: "Sequence number of the item within the order (1-based)."
        data_tests: [not_null]
      - name: product_id
        data_tests: [not_null]
      - name: seller_id
        data_tests: [not_null]
      - name: price
        data_tests: [not_null]

  - name: stg_order_payments
    description: "One row per payment method used on an order."
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: payment_type
        data_tests:
          # No `quote: false` here on purpose: these are string values, and
          # `quote: false` renders them as bare identifiers, which produces
          # `column "credit_card" does not exist` instead of a test.
          - accepted_values:
              arguments:
                values:
                  - credit_card
                  - boleto
                  - voucher
                  - debit_card
                  - not_defined
      - name: payment_value
        data_tests: [not_null]

  - name: stg_order_reviews
    description: "Review score and free-text comment, in Portuguese."
    columns:
      - name: review_id
        data_tests: [not_null]
      - name: order_id
        data_tests: [not_null]
      - name: review_score
        description: "1 to 5 stars. 5 is best."
        data_tests: [not_null]

  - name: stg_products
    description: "Product attributes, with the source typos corrected."
    columns:
      - name: product_id
        description: "Primary key."
        data_tests: [unique, not_null]

  - name: stg_sellers
    description: "Seller identity and location."
    columns:
      - name: seller_id
        description: "Primary key."
        data_tests: [unique, not_null]

  - name: stg_geolocation
    description: >
      Zip-code-prefix to coordinates. Deliberately NOT deduplicated: there are
      many rows per prefix. Aggregate before joining.
    columns:
      - name: zip_code_prefix
        data_tests: [not_null]

  - name: stg_product_category_translation
    description: "Portuguese to English product category names."
    columns:
      - name: category_name
        data_tests: [unique, not_null]
