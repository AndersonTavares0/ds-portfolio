# Every document in this directory is in Portuguese.
#
# One key is doing all the work: Quarto localises its own interface strings
# (the search box, the navigation toggler, the table-of-contents heading) from
# `lang`, so no `_language.yml` is needed and the page furniture is Portuguese
# without any translation of Quarto's output.
#
# The navbar is NOT set here on purpose. Quarto allows exactly one navbar for
# the whole website, and both `website.navbar` and a top-level `navbar` key in
# this file were tested and ignored. See `_quarto.yml`.
lang: pt-BR
