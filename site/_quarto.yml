project:
  type: website
  output-dir: _site

# One project, two builds.
#
# Quarto allows exactly ONE navbar per website, and a `_metadata.yml` in a
# subdirectory cannot override it — both a nested `website.navbar` and a
# top-level `navbar` key were tried in `pt/` and both were ignored. The
# documented way to publish several versions of one website is project
# profiles, so the language, the navigation and the render list each live in a
# profile file (`_quarto-en.yml`, `_quarto-pt.yml`) and `tasks.py render` builds
# both into this one output directory. Each language therefore gets a native
# navbar, and the switcher is a single item in it pointing at the other
# language, rather than the two languages sitting side by side.
#
# The render lists are per profile and are deliberately explicit: they are the
# second guard (the first is the filesystem) on what becomes a published page.
# Governance documentation lives outside `site/` entirely, so it cannot leak.
profile:
  group:
    - [en, pt]
  default: en

website:
  title: "Retail Analytics Portfolio"
  description: "End-to-end data science on the Olist Brazilian e-commerce dataset: measurement, prediction, and the voice of the customer."
  site-url: https://AndersonTavares0.github.io/ds-portfolio/
  repo-url: https://github.com/AndersonTavares0/ds-portfolio
  page-footer:
    left: "Built with Quarto. Data © Olist."
    right:
      - href: https://github.com/AndersonTavares0/ds-portfolio
        text: GitHub

format:
  html:
    # Two bundles, chosen by the reader's operating system rather than by a
    # toggle: `light` is what a reader with no dark preference sees, and `dark`
    # is what `prefers-color-scheme: dark` selects. Both pull the same rules
    # from `_theme-rules.scss`, so a rule is written once and works in either
    # mode; only the palette in the defaults block differs.
    theme:
      light:
        - cosmo
        - theme/theme.scss
      dark:
        - darkly
        - theme/theme-dark.scss
    # Quarto's light/dark pair defaults to light and only changes when the reader
    # clicks the toggle. This makes the first visit follow the operating system
    # instead, and a reader who then chooses explicitly keeps that choice.
    respect-user-color-scheme: true
    # The Source family, loaded from Google Fonts. `display=swap` so text is
    # readable immediately in the fallback serif.
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
    toc: true
    toc-depth: 3
    code-fold: true
    code-summary: "Show the code"
    fig-align: center
    grid:
      sidebar-width: 240px
      body-width: 680px
      margin-width: 240px

# Reports are pre-executed and committed, and the figures are pre-rendered PNGs.
# `freeze` makes CI fast and stable. Because nothing on this site executes code,
# the publish workflow needs neither the database nor the 126 MB dataset.
# NOTE: `_freeze/` must be committed to git if execution is ever introduced —
# it is deliberately not in .gitignore.
freeze: true
