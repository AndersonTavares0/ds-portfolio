project:
  type: website
  output-dir: _site

  # Only these files become pages on the published site.
  #
  # The Quarto project root is now this `site/` directory rather than the
  # repository root, so governance documentation (`../docs/`, `../AGENTS.md`,
  # `../README.md`) is out of reach by construction and cannot leak onto the
  # website as unstyled pages. The explicit list is kept as a second guard: it
  # says, in one place, exactly what the site is.
  render:
    - index.qmd
    - about.qmd
    - pt/index.qmd
    - pt/about.qmd
    - reports/01-retail-analytics/*.qmd
    - pt/reports/01-retail-analytics/*.qmd

website:
  title: "Retail Analytics Portfolio"
  description: "End-to-end data science on the Olist Brazilian e-commerce dataset: measurement, prediction, and the voice of the customer."
  site-url: https://AndersonTavares0.github.io/ds-portfolio/
  repo-url: https://github.com/AndersonTavares0/ds-portfolio
  navbar:
    background: primary
    search: true
    # Quarto allows exactly ONE navbar for the whole website: a `_metadata.yml`
    # in a subdirectory cannot override it. Both a nested `website.navbar` and a
    # top-level `navbar` key were tried in `pt/` and both were ignored, so this
    # navbar lists both languages rather than pretending to switch between them,
    # and each translated page links to its counterpart in its own body.
    left:
      - href: index.qmd
        text: Home
      - href: pt/index.qmd
        text: Início
      - text: Projects · Projetos
        menu:
          - href: reports/01-retail-analytics/01-business-analytics.qmd
            text: "01 · Retail Analytics (EN)"
          - href: pt/reports/01-retail-analytics/01-business-analytics.qmd
            text: "01 · Análise de Varejo (PT)"
          - href: reports/01-retail-analytics/00-executive-memo.qmd
            text: "01 · Decision memo (EN)"
          - href: pt/reports/01-retail-analytics/00-executive-memo.qmd
            text: "01 · Memorando de decisão (PT)"
      - href: about.qmd
        text: About
      - href: pt/about.qmd
        text: Sobre
  page-footer:
    left: "Built with Quarto · Data © Olist"
    right:
      - href: https://github.com/AndersonTavares0/ds-portfolio
        text: GitHub

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    code-fold: true
    code-summary: "Show the code"
    fig-align: center
    grid:
      sidebar-width: 260px
      body-width: 860px
      margin-width: 260px

# Reports are pre-executed and committed, and the figures are pre-rendered PNGs.
# `freeze` makes CI fast and stable. Because nothing on this site executes code,
# the publish workflow needs neither the database nor the 126 MB dataset.
# NOTE: `_freeze/` must be committed to git if execution is ever introduced —
# it is deliberately not in .gitignore.
freeze: true
