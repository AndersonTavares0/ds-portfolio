name: Publish website

# Publishes the Quarto site to the `gh-pages` branch, which GitHub Pages serves.
#
# The website is a Quarto project rooted at `site/`, so the publish action is
# given `path: site` rather than being run from the repository root.
#
# ONE-TIME SETUP — already done for this repository; recorded for anyone forking it:
#
#   1. The `gh-pages` branch must exist before this workflow can publish. The
#      Quarto documentation tells you to run `quarto publish gh-pages` locally
#      once and claims that this creates a `_publish.yml` file "required by the
#      GitHub Action". The second half of that is wrong: this repository contains
#      no `_publish.yml` and publishes successfully. The branch was the only real
#      requirement — every failure before it existed was
#      "the remote origin does not have a branch named gh-pages", and nothing
#      else changed when it went green.
#
#   2. GitHub Pages then deploys from `gh-pages` / `/` automatically. No
#      Settings -> Pages change is required for a project site; confirm with
#      `gh api repos/<owner>/<repo>/pages`.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-deploy:
    name: render + publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Reports are pre-executed and `freeze: true` is set, so rendering does
      # not need the database or the dataset.
      #
      # The site is TWO Quarto builds shipped as one. `tasks.py render` renders
      # the English profile into `_site/` and the Portuguese profile into
      # `.build-pt/`, then copies the latter into `_site/pt/`.
      #
      # This must run here rather than being left to the publish action. The
      # action renders with the project's DEFAULT profile, which is `en`, so
      # nothing ever produced `pt/index.html` or `pt/about.html`: the published
      # site was missing the Portuguese home page and about page, and shipped
      # `pt/index.qmd` verbatim instead. The action is therefore told not to
      # render, and publishes the tree this step built.
      - name: Render the bilingual site
        run: uv run python tasks.py render

      - name: Publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: site
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
